# 开发环境配置
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campus_market_dev?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&rewriteBatchedStatements=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    # 数据库密码通过环境变量注入（PowerShell: setx DB_PASSWORD "你的密码" 后重开终端生效），切勿提交真实密码
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      leak-detection-threshold: 60000

  # 邮件服务配置（密码重置验证码）
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    default-encoding: UTF-8

  sql:
    init:
      encoding: UTF-8
      mode: never

  # 延迟初始化，给数据库更多时间启动
  main:
    lazy-initialization: false

  # 开发环境允许跨域
  # 说明：本地开发时前端通过 Vite dev server（3000 端口）访问页面，
  #       axios 发送 API 请求有两种情况：
  #       ① 电脑本机浏览器打开 http://localhost:3000  →  Origin = http://localhost:3000
  #       ② 同一 WiFi 下手机打开 http://<本机局域网IP>:3000  →  Origin 同理
  #       使用 allowed-origin-patterns 通配写法，局域网 IP 变化时无需修改配置。
  web:
    cors:
      allowed-origin-patterns:
        - "http://localhost:[*]"          # 本机通过 localhost 访问前端
        - "http://127.0.0.1:[*]"          # 本机通过 127.0.0.1 访问前端（兼容 IPv4 回环直接写 IP 的场景）
        - "http://192.168.*:[*]"          # 同一 WiFi 下手机 / 其他电脑通过局域网访问前端
      allowed-methods: "*"                  # 允许所有 HTTP 方法（GET/POST/PUT/DELETE/PATCH/OPTIONS）
      allowed-headers: "*"                  # 允许浏览器带任意请求头，包括 JWT 用的 Authorization、Axios 的 Content-Type
      allow-credentials: true               # 允许携带 Cookie / Authorization 头。
                                            # 注意：开启 credentials 时，allowed-origins 不能写 "*"，
                                            # 所以这里用 allowed-origin-patterns 逐条通配而不是 "*"。

mybatis:
  mapper-locations: classpath:mappers/*.xml
  type-aliases-package: com.campus.backend.entity
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 3000
    default-fetch-size: 100

server:
  port: 8080

# 开发环境日志级别
logging:
  level:
    com.campus.backend: DEBUG
    org.springframework.security: DEBUG

# 文件上传配置
app:
  upload:
    base-path: ./uploads
    image-max-size: 10485760  # 10MB
    avatar-max-size: 5242880  # 5MB
    allowed-types: image/jpeg,image/png,image/webp
    allowed-extensions: jpg,jpeg,png,webp
    compression-quality: 0.8
    max-width: 1920
    max-height: 1080
    chunk-size: 2097152  # 2MB per chunk
    temp-path: ./uploads/temp

# JWT 配置
jwt:
  expiration: 259200000  # 3 天（3 × 24 × 3600 × 1000），开发演示环境免频繁重登